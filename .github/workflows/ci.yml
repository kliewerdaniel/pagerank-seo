name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Lint
        run: |
          pip install flake8
          flake8 src/ --max-line-length=120 --extend-ignore=E501

      - name: Test with pytest
        run: |
          pytest tests/ -v --tb=short --cov=pagerank_seo --cov-report=term-missing

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: CLI smoke test
        run: |
          pagerank-seo --version
          pagerank-seo audit https://example.com --max-pages 5 --max-depth 2 --output json 2>/dev/null | python -c "import json,sys; d=json.load(sys.stdin); print('composite:', d['composite_score']); print('recommendations:', len(d['recommendations']))"
